name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ARM APKs only
      # O parâmetro -Pandroid.bundle.enableSplit=false garante um APK universal se preferir,
      # mas aqui focamos em gerar o Release padrão.
      run: ./gradlew assembleRelease -Pandroid.injected.abi.list=armeabi-v7a,arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: traccar-server-arm-apk
        path: app/build/outputs/apk/release/*.apk
