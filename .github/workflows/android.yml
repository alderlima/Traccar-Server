name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ARM Debug APK
      # O parâmetro abaixo filtra apenas as arquiteturas de celular (ARM 32 e 64 bits)
      run: ./gradlew assembleDebug -Pandroid.injected.abi.list=armeabi-v7a,arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: traccar-server-arm-debug
        # Usamos o wildcard * para pegar o APK gerado independente do nome exato
        path: app/build/outputs/apk/debug/*.apk
