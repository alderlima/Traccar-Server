name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate keystore
      run: |
        # Criando a keystore dentro da pasta app conforme sua estrutura
        mkdir -p app
        keytool -genkeypair \
          -alias testkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -keystore app/test.keystore \
          -storepass android \
          -keypass android \
          -dname "CN=Test,O=Test,C=BR"

    - name: Create key.properties
      run: |
        # O key.properties fica na raiz para o build.gradle ler
        echo "storePassword=android" > key.properties
        echo "keyPassword=android" >> key.properties
        echo "keyAlias=testkey" >> key.properties
        # Caminho relativo ao build.gradle (que está dentro de /app)
        echo "storeFile=test.keystore" >> key.properties

    - name: Build Signed APK (Release)
      run: ./gradlew :app:assembleRelease -Pandroid.injected.abi.list=armeabi-v7a,arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: traccar-server-arm-signed
        path: app/build/outputs/apk/release/*.apk
