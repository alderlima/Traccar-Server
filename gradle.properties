# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the build.gradle files in the project.

# For more details on how to configure your build environment visit
# http://www.gradle.org/configure-gradle-for-your-environment

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also
# http://gradle.org/docs/current/userguide/build_environment.html
# for more details on how to configure your build environment
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/configure-gradle-for-your-environment
# org.gradle.parallel=true

# AndroidX package structure to make it easier to discover and migrate existing, old-style packages
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include transitive dependency
# R classes. Having library resources in transitive dependencies is not a new concept;
# it is just that, previously, the public R class of a library depended on the R classes
# of all of its dependencies, whereas now it is possible to have a library R class that
# only depends on the R classes of its own resources - the resources declared in the
# library's own package. This is especially important for defining static libraries, as
# some of the utilities it exports may not be part of the API.
android.nonTransitiveRClass=true
